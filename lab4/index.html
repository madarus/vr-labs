<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <!-- Подключение A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- Подключение AR.js для работы с маркерами -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">

    <!-- AR-сцена использует камеру устройства -->
    <a-scene
        embedded
        vr-mode-ui="enabled: false"
        arjs="sourceType: webcam; debugUIEnabled: false;"
    >

        <!-- Загрузка 3D-модели -->
        <a-assets>
            <a-asset-item
                id="model"
                src="model.glb">
            </a-asset-item>
        </a-assets>

        <!-- Стандартный Hiro-маркер -->
        <a-marker preset="hiro">

            <!-- Модель отображается относительно положения маркера -->
            <a-entity
                gltf-model="#model"
                position="0 0.05 0"
                rotation="-90 0 0"
                scale="0.3 0.3 0.3">
            </a-entity>

        </a-marker>

        <!-- Камера телефона -->
        <a-entity camera></a-entity>

    </a-scene>

</body>
</html>
